<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Présentation du stage – Portfolio BTS SIO – Noé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="Carousel.css">
</head>
<body>

<header class="nav">
  <div class="wrap">
    <b>Noé</b>
    <nav aria-label="Navigation principale">
      <ul>
        <li><a href="index.html#presentation">Présentation</a></li>
        <li><a href="index.html#realisations">Réalisations</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
<section>
  <div class="wrap">
    <a class="back" href="index.html#realisations">← Retour aux réalisations</a>
    <h2>Présentation de mon stage chez Antea Group</h2>
    <p class="lead">Voici les diapositives que j’ai présentées à la fin de mon stage. Utilisez les boutons, les flèches du clavier ou faites glisser pour les parcourir.</p>

    <div class="carousel" role="region" aria-roledescription="carrousel" aria-label="Diapositives de la présentation de stage">
      <div class="track" id="track" tabindex="0"></div>

      <div class="controls">
        <button class="ctrl" id="prev" type="button">Précédente</button>
        <span class="count" id="count" aria-live="polite"></span>
        <button class="ctrl" id="next" type="button">Suivante</button>
      </div>
      <ul class="dots" id="dots"></ul>
    </div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">Portfolio BTS SIO, session 2027</div>
</footer>

<script>
  // À MODIFIER : nombre de diapositives (images slides/diapo-1.jpg, diapo-2.jpg, ...)
  const TOTAL = 3;
  const EXT = "png";

  const track = document.getElementById("track");
  const dots = document.getElementById("dots");
  const count = document.getElementById("count");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  let current = 0;

  for (let i = 1; i <= TOTAL; i++) {
    const fig = document.createElement("figure");
    fig.className = "slide";
    const img = document.createElement("img");
    img.src = "slides/diapo-" + i + "." + EXT;
    img.alt = "Diapositive " + i + " sur " + TOTAL;
    if (i > 1) img.loading = "lazy";
    fig.appendChild(img);
    track.appendChild(fig);

    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", "Aller à la diapositive " + i);
    b.addEventListener("click", () => goTo(i - 1));
    li.appendChild(b);
    dots.appendChild(li);
  }

  function goTo(n) {
    n = Math.max(0, Math.min(TOTAL - 1, n));
    track.scrollTo({ left: n * track.clientWidth });
  }

  function update() {
    current = Math.round(track.scrollLeft / track.clientWidth);
    count.textContent = (current + 1) + " / " + TOTAL;
    prev.disabled = current === 0;
    next.disabled = current === TOTAL - 1;
    dots.querySelectorAll("button").forEach((b, i) =>
      b.setAttribute("aria-current", i === current ? "true" : "false"));
  }

  prev.addEventListener("click", () => goTo(current - 1));
  next.addEventListener("click", () => goTo(current + 1));
  track.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", () => { goTo(current); update(); });
  track.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); goTo(current + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); goTo(current - 1); }
  });
  update();
</script>
</body>
</html>
